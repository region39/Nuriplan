<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="np-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="np-leaf" x1="33" y1="16" x2="47" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="np-gold" x1="42" y1="10" x2="54" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="np-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="64" height="64" rx="16" fill="url(#np-bg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" />

  <!-- Dish / Cloche base rim -->
  <path d="M 15 44 C 23 50, 41 50, 49 44" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9" />

  <!-- Chef Toque & Sprout Motif -->
  <g filter="url(#np-shadow)">
    <!-- Base band of toque -->
    <rect x="22" y="37" width="20" height="4" rx="2" fill="#ffffff" />
    
    <!-- Left toque puff -->
    <path d="M 23 36 C 19 33, 18 26, 23 22 C 26 19, 29 23, 29 27 C 29.5 30, 28 34, 26 36 Z" fill="#ffffff" />
    
    <!-- Central toque crest -->
    <path d="M 26 27 C 26 19, 32 16, 36 19 C 39 21, 39 26, 37 36 L 26 36 Z" fill="#ffffff" />
    
    <!-- Right fresh nutrition leaf/sprout -->
    <path d="M 35 24 C 36 17, 44 16, 46 21 C 48 26, 44 32, 38 36 Z" fill="url(#np-leaf)" />
    
    <!-- Leaf accent line -->
    <path d="M 37 32 C 40 27, 43 23, 44 20" stroke="#065f46" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- NutriPlan "+" Accent Badge -->
  <g filter="url(#np-shadow)">
    <circle cx="48" cy="16" r="7" fill="url(#np-gold)" />
    <path d="M 48 12.5 V 19.5 M 44.5 16 H 51.5" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
